<!-- Resent Client 5.0 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Resent Client 5.0</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading Resent 5.0…</div>
  <script>
    async function run() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/mrjo3000/--Eaglercraft-Clients---@main/Resent%20Client%205.0.html",
        "https://cdn.jsdelivr.net/gh/sillysausage892/eaglercraft-version-list@master/ResentClient_1.8_PROD_WASM.html",
        "https://cdn.jsdelivr.net/gh/sillysausage892/eaglercraft-version-list@master/ResentClient_1.8_PROD_JS.html"
      ];
      let lastErr;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) throw new Error(res.status);
          document.open(); document.write(await res.text()); document.close(); return;
        } catch (e) { lastErr = e; }
      }
      document.getElementById("s").textContent = "Load failed: " + lastErr;
    }
    run();
  </script>
</body>
</html>
