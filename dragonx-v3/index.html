<!-- DragonX V3 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DragonX V3</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading DragonX V3…</div>
  <script>
    async function run() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/FlamePVPCodes/Eaglercraft-Clients@main/DragonX%20V3%20Client.html",
        "https://cdn.jsdelivr.net/gh/Egnious/Eaglercraft-Clients@main/DragonX%20V3.html"
      ];
      let lastErr;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) throw new Error(res.status);
          document.open(); document.write(await res.text()); document.close(); return;
        } catch (e) { lastErr = e; }
      }
      document.getElementById("s").textContent = "Load failed: " + lastErr;
    }
    run();
  </script>
</body>
</html>
