<!-- Fuchsiax Ghost Client -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fuchsiax Ghost</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading Fuchsiax Ghost…</div>
  <script>
    async function run() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/valux-game/Minecraft-Clients@main/Fuchsiax%20Ghost%20Client%20WITH%20ACCOUNT%20MANAGER.html",
        "https://cdn.jsdelivr.net/gh/iEmaz/eagler-hacked-clients@main/Fuchsiax%20Ghost%20Client%20WITH%20ACCOUNT%20MANAGER.html",
        "https://cdn.jsdelivr.net/gh/Egnious/Eaglercraft-Clients@main/FuchsiaX%20Client.html"
      ];
      let lastErr;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) throw new Error(res.status);
          document.open(); document.write(await res.text()); document.close(); return;
        } catch (e) { lastErr = e; }
      }
      document.getElementById("s").textContent = "Load failed: " + lastErr;
    }
    run();
  </script>
</body>
</html>
