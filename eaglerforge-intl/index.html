<!-- EaglerForge International 1.2.5/1.8 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EaglerForge International</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading EaglerForge International…</div>
  <script>
    async function run() {
      const res = await fetch("https://cdn.jsdelivr.net/gh/valux-game/Minecraft-Clients@main/EaglerForge_1.2.5_1.8_Offline_International.html");
      if (!res.ok) throw new Error(res.status);
      document.open(); document.write(await res.text()); document.close();
    }
    run().catch(e => { document.getElementById("s").textContent = "Load failed: " + e; });
  </script>
</body>
</html>
