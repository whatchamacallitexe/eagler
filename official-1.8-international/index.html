<!-- EaglercraftX 1.8 International -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EaglercraftX 1.8 International</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading EaglercraftX 1.8 International…</div>
  <script>
    async function run() {
      const res = await fetch("https://cdn.jsdelivr.net/gh/Boris1234568/eaglercraft@main/1.8_international.html");
      if (!res.ok) throw new Error(res.status);
      const html = await res.text();
      document.open();
      document.write(html);
      document.close();
    }
    run().catch(e => { document.getElementById("s").textContent = "Load failed: " + e; });
  </script>
</body>
</html>
