<!-- DragonX V2 International -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DragonX V2</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading DragonX V2…</div>
  <script>
    async function run() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/valux-game/Minecraft-Clients@main/DragonX_V2_International.html",
        "https://cdn.jsdelivr.net/gh/iEmaz/eagler-hacked-clients@main/DragonX_V2_International%20(1)%20(1).html"
      ];
      let lastErr;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) throw new Error(res.status);
          document.open(); document.write(await res.text()); document.close(); return;
        } catch (e) { lastErr = e; }
      }
      document.getElementById("s").textContent = "Load failed: " + lastErr;
    }
    run();
  </script>
</body>
</html>
