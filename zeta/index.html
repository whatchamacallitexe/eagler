<!-- Eaglercraft client loader -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zeta Client</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading Zeta Client…<br><small>This can take a while on first load</small></div>
  <script>
    async function run() {
      const urls = [
        "https://cdn.jsdelivr.net/gh/shayderrr/eaglercraft@main/zetaclient/clZetaClient.html.part1",
        "https://cdn.jsdelivr.net/gh/shayderrr/eaglercraft@main/zetaclient/clZetaClient.html.part2"
      ];
      let fullHtml = "";
      for (const u of urls) {
        const res = await fetch(u);
        if (!res.ok) throw new Error(res.status + " " + u);
        fullHtml += await res.text();
      }
      document.open();
      document.write(fullHtml);
      document.close();
    }
    run().catch(e => { document.getElementById("s").textContent = "Load failed: " + e; });
  </script>
</body>
</html>
