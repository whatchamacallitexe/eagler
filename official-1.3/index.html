<!-- Eaglercraft Beta 1.3 -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Eaglercraft 1.3</title>
  <style>body{margin:0;background:#111;color:#0f0;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh}#s{text-align:center}</style>
</head>
<body>
  <div id="s">Loading Eaglercraft 1.3…</div>
  <script>
    async function run() {
      // 1.3 may 403 on some CDNs — try multiple
      const urls = [
        "https://raw.githubusercontent.com/Boris1234568/eaglercraft/main/1.3.html",
        "https://cdn.jsdelivr.net/gh/Boris1234568/eaglercraft@main/1.3.html"
      ];
      let lastErr;
      for (const u of urls) {
        try {
          const res = await fetch(u);
          if (!res.ok) throw new Error(res.status);
          const html = await res.text();
          document.open();
          document.write(html);
          document.close();
          return;
        } catch (e) { lastErr = e; }
      }
      document.getElementById("s").textContent = "Load failed: " + lastErr;
    }
    run();
  </script>
</body>
</html>
